org.gradle.jvmargs=-Xmx768m -Dfile.encoding=UTF-8
org.gradle.workers.max=1
# The Android launcher's own version. Bump it for a new release line.
smsAndroidVersion=1.1.0
# true: the next push to main with changelog lines publishes smsAndroidVersion
# itself as a full release instead of its next preview. The release workflow
# then sets this back to false and moves smsAndroidVersion to the next patch.
smsAndroidFullRelease=true
# Local builds have no preview number. The release workflow numbers each
# published preview (1-99) itself.
smsAndroidPreview=0
# Reuse task outputs and the configured build between runs. CI saves both
# with gradle/actions/setup-gradle.
org.gradle.caching=true
org.gradle.configuration-cache=true
